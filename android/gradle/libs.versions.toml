# Verze sladěné s Vibe (compileSdk 36 + AGP 8.13), které u autora prokazatelně fungují.
[versions]
agp = "8.13.0"
kotlin = "2.3.21"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.9.8"
composeBom = "2026.06.01"
work = "2.12.0"
datastore = "1.2.1"
coil = "3.5.0"
coroutines = "1.11.0"
# UniFFI Kotlin bindingy volají Rust přes JNA.
jna = "5.17.0"
# libmpv + FFmpeg pro Android (MIT, github.com/abdallahmehiz/mpv-android).
mpv = "0.2.2"
# Google Cast (Chromecast / Google TV) — výchozí přijímač Googlu.
castFramework = "22.3.1"
mediarouter = "1.8.1"
# MediaSession + notifikace s ovládáním (přehrávač je mpv, ne Media3).
androidxMedia = "1.7.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
mpv = { module = "io.github.abdallahmehiz:mpv-android-lib", version.ref = "mpv" }
cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "castFramework" }
mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

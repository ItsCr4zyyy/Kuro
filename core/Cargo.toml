[workspace]
resolver = "2"
members = ["kuro-core", "kuro-ffi", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.dependencies]
regex = "1"
unicode-normalization = "0.1"
md-5 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

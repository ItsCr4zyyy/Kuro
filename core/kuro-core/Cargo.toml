[package]
name = "kuro-core"
description = "Kuro: business logic (providers, matcher, metadata, storage). No FFI here."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
regex.workspace = true
unicode-normalization.workspace = true
md-5.workspace = true
sha1 = "0.10"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time"] }
# rustls + ring: bez OpenSSL a bez cmake, přeloží se i přes cargo-ndk.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
dotenvy = "0.15"
